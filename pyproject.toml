[project]
name = "manos-a-la-obra"
version = "0.1.0"
description = "Centralizacion de informacion de ayuda para el terremoto en Colombia"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1",
    "pyyaml>=6.0",
    "gunicorn>=23.0",
]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
