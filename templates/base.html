<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Manos a la Obra{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="/">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.35-9.5-8.5C.5 8.5 3 4.5 7 4.5c2 0 3.5 1.2 5 3 1.5-1.8 3-3 5-3 4 0 6.5 4 4.5 8-2.5 4.15-9.5 8.5-9.5 8.5z"/><path d="M8.5 12.5h2l1-2 2 4 1-2h2"/></svg>
        </span>
        <span><b>Manos a la Obra</b><small>Ayuda para el terremoto en Colombia</small></span>
      </a>
      <nav class="site-nav">
        <a href="/impresion-3d" {% if request.path == '/impresion-3d' %}aria-current="page"{% endif %}>Impresión 3D</a>
        <a href="/puntos-acopio" {% if request.path == '/puntos-acopio' %}aria-current="page"{% endif %}>Puntos de acopio</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Información colaborativa y curada. Verifica antes de actuar.</p>
      <p class="updated mono"><span class="udot"></span>Actualizado al publicar</p>
    </div>
  </footer>
</body>
</html>
